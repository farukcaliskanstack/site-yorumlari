<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sayfa bulunamadı · Faruk Çalışkan</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #fff8f0; --text: #1b1530; --muted: #5f5876; --accent: #7b5cff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d0c14; --text: #f3f0ea; --muted: #a39db5; --accent: #a594ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 20px/1.6 "Patrick Hand", "Segoe Print", cursive, sans-serif; text-align: center; padding: 24px; }
  h1 { font-family: "Caveat", cursive; font-size: clamp(4rem, 14vw, 7rem); margin: 0; line-height: 1; color: var(--accent); }
  p { color: var(--muted); margin: 12px 0 24px; }
  a { color: var(--accent); font-weight: 600; text-decoration: none; border: 2px solid var(--accent); padding: 10px 22px; border-radius: 999px; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Aradığınız sayfa bulunamadı ya da taşınmış olabilir.</p>
    <a href="index.html">Ana sayfaya dön</a>
  </main>
</body>
</html>
